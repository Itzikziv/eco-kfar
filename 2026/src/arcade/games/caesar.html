<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* ===== Shared arcade look. Change colors if you like. ===== */
  :root { --bg:#0d0b1f; --panel:#1a1640; --accent:#ff3cac; --accent2:#2bd2ff; --text:#f2f0ff; --dim:#9a94c9; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font-family:"Rubik", Arial, sans-serif; user-select:none; -webkit-user-select:none; }
  .screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center;
            justify-content:center; text-align:center; padding:20px; gap:14px; }
  .screen.active { display:flex; }
  h1 { color:var(--accent); text-shadow:0 0 10px var(--accent); font-size:clamp(28px,7vw,56px); margin:0; }
  p  { max-width:520px; color:var(--dim); margin:0; }
  input { font:inherit; font-size:20px; padding:10px; border-radius:8px; border:2px solid var(--accent2);
          background:var(--panel); color:var(--text); text-align:center; width:240px; }
  button { font:inherit; font-size:22px; font-weight:bold; padding:12px 28px; border:none; border-radius:10px;
           background:var(--accent); color:#fff; cursor:pointer; }
  #hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between;
         padding:10px 16px; font-size:20px; z-index:5; pointer-events:none; }
  #game { position:fixed; inset:0; }
  .ltr { direction:ltr; unicode-bidi:isolate; }
  #saveMsg { color:var(--dim); font-size:14px; min-height:18px; }
  #overNote { max-width:520px; font-size:18px; line-height:1.6; }
  #overNote:empty { display:none; }
</style>
</head>
<body>

<!-- ===== START SCREEN ===== -->
<div class="screen active" id="startScreen">
  <h1 id="gameTitle">המשחק שלנו</h1>
  <div id="gameHelp" style="max-width:560px;color:var(--dim);line-height:1.6">כאן מסבירים איך משחקים.</div>
  <input id="playerName" maxlength="20" placeholder="השם שלכם">
  <button onclick="startGame()">התחילו</button>
</div>

<!-- ===== GAME SCREEN ===== -->
<div class="screen" id="gameScreen">
  <div id="hud"><span id="hudLeft"></span><span id="hudRight"></span></div>
  <div id="game"></div>
</div>

<!-- ===== GAME OVER SCREEN ===== -->
<div class="screen" id="overScreen">
  <h1>המשחק נגמר</h1>
  <p>הניקוד שלכם</p>
  <div id="finalScore" class="ltr" style="font-size:56px;color:var(--accent2)"></div>
  <div id="overNote"></div>
  <div id="saveMsg"></div>
  <button onclick="startGame()">שחקו שוב</button>
  <a id="backLink" target="_top" style="display:none;color:var(--accent2);margin-top:8px">→ חזרה לארקייד</a>
</div>

<script>
/* =====================================================================
   GAME_ID: a short name for your game, lowercase, no spaces.
   The file goes in the repo as  2026/src/arcade/games/<GAME_ID>.html
   ===================================================================== */
const GAME_ID = 'caesar';

/* =====================================================================
   SHELL — you don't need to change this part
   ===================================================================== */
// true when running inside the teacher's Apps Script arcade,
// false when you open this file locally by double-clicking it
const IN_ARCADE = typeof google !== 'undefined' && !!(google.script && google.script.run);

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function hud(left, right) {
  document.getElementById('hudLeft').textContent = left ?? '';
  document.getElementById('hudRight').textContent = right ?? '';
}
function playerName() {
  return document.getElementById('playerName').value.trim() || 'אנונימי';
}
let gameRunning = false;

function startGame() {
  show('gameScreen');
  gameRunning = true;
  setupGame(document.getElementById('game'));
}

// gameOver(score)        — ends the game
// gameOver(score, note)  — optional note shown under the score (text or HTML)
function gameOver(score, note) {
  if (!gameRunning) return;          // protects against calling it twice
  gameRunning = false;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('overNote').innerHTML = note || '';
  const msg = document.getElementById('saveMsg');
  show('overScreen');

  if (!IN_ARCADE) {                  // opened by double-click on your computer
    msg.textContent = 'בדיקה מקומית: הניקוד לא נשמר. (בארקייד הוא יישמר.)';
    return;
  }
  msg.textContent = 'שומר ניקוד…';
  google.script.url.getLocation(loc => {
    const id = loc.parameter.game || GAME_ID;
    google.script.run
      .withSuccessHandler(() => msg.textContent = 'הניקוד נשמר בארקייד ✔')
      .withFailureHandler(e => msg.textContent = 'השמירה נכשלה: ' + e.message)
      .submitScore(id, playerName(), score);
  });
}

// Inside the arcade, show a link back to the lobby
if (IN_ARCADE) {
  google.script.run.withSuccessHandler(url => {
    const a = document.getElementById('backLink');
    a.href = url + '?page=arcade';
    a.style.display = 'inline-block';
  }).getBaseUrl();
}

/* =====================================================================
   GAME: CAESAR RACE  (example game — easy/medium level)
   Decode as many encrypted words as you can in 60 seconds.
   This is exactly the char arithmetic from class:
       (char)('a' + (ch - 'a' + shift) % 26)
   Levels: the first words use a small shift (easy to count),
   later words use bigger shifts.
   Ideas for students to extend:
     - hide the shift, only give a hint
     - words from our school / CS vocabulary
   ===================================================================== */
document.getElementById('gameTitle').textContent = 'מרוץ קיסר';
document.getElementById('gameHelp').innerHTML = `
  <b style="color:var(--text)">המשימה: לגלות את המילה המקורית.</b><br>
  כל מילה הוצפנה: כל אות זזה <b>קדימה</b> באלף-בית לפי מספר ההזזה. למשל, בהזזה 3:
  <div dir="ltr" style="margin:10px auto;padding:8px 12px;border:1px solid var(--accent2);border-radius:8px;
       font-family:'Courier New',monospace;font-size:20px;color:var(--text);max-width:260px">
    java &nbsp;—(+3)→&nbsp; <span style="color:var(--accent2)">mdyd</span>
  </div>
  אתם מקבלים את <span class="ltr" style="color:var(--accent2)">mdyd</span>,
  זזים 3 אותיות <b>אחורה</b>, ומקלידים <span class="ltr">java</span>.<br>
  שורת האלף-בית במסך עוזרת לספור. תקועים? אפשר לדלג.<br>
  <b style="color:var(--text)">60 שניות. כל מילה שפוענחה = נקודה.</b>`;

const WORDS = ['java', 'loop', 'class', 'string', 'random', 'array', 'method', 'boolean',
               'python', 'pixel', 'debug', 'binary', 'syntax', 'object', 'return', 'switch'];
const RACE_SECONDS = 60;
const ALPHABET = 'abcdefghijklmnopqrstuvwxyz';

// Same idea as in Java: shift each letter, wrap around with % 26
function caesar(word, shift) {
  let out = '';
  for (const ch of word) {
    const code = 'a'.charCodeAt(0) + (ch.charCodeAt(0) - 'a'.charCodeAt(0) + shift) % 26;
    out += String.fromCharCode(code);
  }
  return out;
}

// Level by number of words solved: small shifts first
function randomShift(solved) {
  const max = solved < 3 ? 3 : solved < 6 ? 6 : 25;
  return 1 + Math.floor(Math.random() * max);
}

function setupGame(area) {
  area.innerHTML = `
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
                justify-content:center;gap:14px;padding:60px 12px 20px;text-align:center">
      <div style="color:var(--dim);font-size:18px">הזזה: <b id="cShiftNum" style="color:var(--text);font-size:24px"></b> · זוזו אחורה באלף-בית</div>
      <div id="cWord" dir="ltr" style="font-size:clamp(36px,10vw,72px);color:var(--accent2);letter-spacing:6px"></div>
      <div id="cAlpha" dir="ltr" style="display:grid;grid-template-columns:repeat(13,1fr);gap:3px;width:min(420px,100%)"></div>
      <input id="cInput" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="המילה המקורית">
      <div style="display:flex;gap:10px">
        <button id="cCheck" style="font-size:18px;padding:8px 18px">בדיקה</button>
        <button id="cSkip"  style="font-size:18px;padding:8px 18px;background:transparent;border:2px solid var(--dim);color:var(--dim)">דלגו</button>
      </div>
      <div id="cFeedback" style="min-height:28px;font-size:20px"></div>
    </div>`;
  const input = document.getElementById('cInput');
  const feedback = document.getElementById('cFeedback');
  let score = 0, timeLeft = RACE_SECONDS, answer = '', encrypted = '';
  const solved = [], skipped = [];

  function drawAlphabet() {
    // highlight the letters that appear in the encrypted word
    document.getElementById('cAlpha').innerHTML = [...ALPHABET].map(ch => {
      const on = encrypted.includes(ch);
      return `<span style="padding:3px 0;border-radius:4px;font-size:15px;` +
             `background:${on ? 'var(--accent2)' : 'var(--panel)'};color:${on ? '#000' : 'var(--dim)'}">${ch}</span>`;
    }).join('');
  }

  function newWord() {
    answer = WORDS[Math.floor(Math.random() * WORDS.length)];
    const shift = randomShift(solved.length);
    encrypted = caesar(answer, shift);
    document.getElementById('cWord').textContent = encrypted;
    document.getElementById('cShiftNum').textContent = shift;
    drawAlphabet();
    input.value = '';
    input.focus();
  }

  function guess() { return input.value.trim().toLowerCase(); }

  // correct answers are accepted while typing
  input.addEventListener('input', () => {
    if (guess() === answer) {
      score++;
      solved.push(answer);
      feedback.innerHTML = '<span style="color:#1db954">✔ נכון! ' + answer + '</span>';
      hud('פוענחו: ' + score, 'זמן: ' + timeLeft);
      newWord();
    }
  });
  function check() {
    if (!guess()) return;
    if (guess() !== answer) feedback.innerHTML = '<span style="color:#ff6b6b">עוד לא… בדקו שזזתם אחורה, לא קדימה</span>';
  }
  input.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
  document.getElementById('cCheck').addEventListener('pointerdown', e => { e.preventDefault(); check(); });
  document.getElementById('cSkip').addEventListener('pointerdown', e => {
    e.preventDefault();
    skipped.push(answer);
    feedback.innerHTML = '<span class="ltr">' + encrypted + ' → ' + answer + '</span> (דילגתם)';
    newWord();
  });

  newWord();
  hud('פוענחו: 0', 'זמן: ' + timeLeft);
  const timer = setInterval(() => {
    timeLeft--;
    hud('פוענחו: ' + score, 'זמן: ' + timeLeft);
    if (timeLeft <= 0) {
      clearInterval(timer);
      let note = '⏰ נגמר הזמן! המילה האחרונה: <span class="ltr" style="color:var(--accent2)">' +
                 encrypted + ' → ' + answer + '</span>';
      if (solved.length) note += '<br>פענחתם: <span class="ltr">' + solved.join(', ') + '</span>';
      if (skipped.length) note += '<br>דילגתם על: <span class="ltr">' + skipped.join(', ') + '</span>';
      if (!solved.length) note += '<br>טיפ: התחילו מהאות הראשונה וספרו אחורה בשורת האלף-בית.';
      gameOver(score, note);
    }
  }, 1000);
}
</script>
</body>
</html>
